<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 640" width="100%" height="100%" style="background:#0d1117; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="adderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9e6a03"/>
      <stop offset="100%" stop-color="#d29922"/>
    </linearGradient>
    
    <marker id="arr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3fb950"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d29922"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#bc8cff"/>
    </marker>
    <filter id="drop" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="15" y="15" width="1220" height="610" rx="14" fill="url(#bg)" stroke="#30363d" stroke-width="1.5" filter="url(#drop)"/>

  <!-- Title Banner -->
  <text x="45" y="52" fill="#f0f6fc" font-size="20" font-weight="700" letter-spacing="0.5">6-TAP MOVING AVERAGE FIR FILTER CORE ARCHITECTURE</text>
  <text x="45" y="73" fill="#8b949e" font-size="12">Parameterized DSP Datapath • Shift-Register Tapped Delay Line • Multiplierless Adder-Tree Reduction • Fixed-Point Scaling</text>

  <!-- Section 1 Header: Tapped Delay Line -->
  <rect x="40" y="92" width="700" height="26" rx="5" fill="#1f6feb" fill-opacity="0.18" stroke="#388bfd" stroke-width="1"/>
  <text x="390" y="110" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">STAGE 1: 6-SAMPLE SYNCHRONOUS TAPPED DELAY LINE (FIFO SHIFT REGISTER CASCADE)</text>

  <!-- Input Port -->
  <rect x="40" y="145" width="85" height="50" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="82" y="170" fill="#f0f6fc" font-size="12" font-weight="700" text-anchor="middle">x_in[7:0]</text>
  <text x="82" y="185" fill="#8b949e" font-size="9" text-anchor="middle">Input Stream</text>

  <!-- Delay Line Registers R0 to R5 -->
  <!-- R0 -->
  <rect x="165" y="140" width="75" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="202" y="165" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">R0 (z⁻¹)</text>
  <text x="202" y="183" fill="#58a6ff" font-size="10" text-anchor="middle">x[n]</text>

  <!-- R1 -->
  <rect x="275" y="140" width="75" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="312" y="165" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">R1 (z⁻¹)</text>
  <text x="312" y="183" fill="#58a6ff" font-size="10" text-anchor="middle">x[n-1]</text>

  <!-- R2 -->
  <rect x="385" y="140" width="75" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="422" y="165" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">R2 (z⁻¹)</text>
  <text x="422" y="183" fill="#58a6ff" font-size="10" text-anchor="middle">x[n-2]</text>

  <!-- R3 -->
  <rect x="495" y="140" width="75" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="532" y="165" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">R3 (z⁻¹)</text>
  <text x="532" y="183" fill="#58a6ff" font-size="10" text-anchor="middle">x[n-3]</text>

  <!-- R4 -->
  <rect x="605" y="140" width="75" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="642" y="165" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">R4 (z⁻¹)</text>
  <text x="642" y="183" fill="#58a6ff" font-size="10" text-anchor="middle">x[n-4]</text>

  <!-- R5 -->
  <rect x="715" y="140" width="75" height="60" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.8"/>
  <text x="752" y="165" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">R5 (z⁻¹)</text>
  <text x="752" y="183" fill="#58a6ff" font-size="10" text-anchor="middle">x[n-5]</text>

  <!-- Delay Line Shifts Connections -->
  <line x1="125" y1="170" x2="165" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="170" x2="275" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="350" y1="170" x2="385" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="460" y1="170" x2="495" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="570" y1="170" x2="605" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="680" y1="170" x2="715" y2="170" stroke="#58a6ff" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Tap Probes -->
  <text x="202" y="130" fill="#8b949e" font-size="10" text-anchor="middle">x0[7:0]</text>
  <text x="312" y="130" fill="#8b949e" font-size="10" text-anchor="middle">x1[7:0]</text>
  <text x="422" y="130" fill="#8b949e" font-size="10" text-anchor="middle">x2[7:0]</text>
  <text x="532" y="130" fill="#8b949e" font-size="10" text-anchor="middle">x3[7:0]</text>
  <text x="642" y="130" fill="#8b949e" font-size="10" text-anchor="middle">x4[7:0]</text>
  <text x="752" y="130" fill="#8b949e" font-size="10" text-anchor="middle">x5[7:0]</text>

  <!-- Section 2 Header: Adder Tree -->
  <rect x="40" y="240" width="760" height="26" rx="5" fill="#238636" fill-opacity="0.18" stroke="#3fb950" stroke-width="1"/>
  <text x="420" y="258" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">STAGE 2: MULTIPLIERLESS BALANCED ADDER TREE (3-LEVEL COMBINATIONAL REDUCTION)</text>

  <!-- Level 1 Adders (Pairwise) -->
  <!-- Adder 01 -->
  <circle cx="257" cy="315" r="24" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="257" y="321" fill="#3fb950" font-size="18" font-weight="700" text-anchor="middle">+</text>
  <text x="257" y="348" fill="#8b949e" font-size="10" text-anchor="middle">s01 [8:0]</text>

  <!-- Adder 23 -->
  <circle cx="477" cy="315" r="24" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="477" y="321" fill="#3fb950" font-size="18" font-weight="700" text-anchor="middle">+</text>
  <text x="477" y="348" fill="#8b949e" font-size="10" text-anchor="middle">s23 [8:0]</text>

  <!-- Adder 45 -->
  <circle cx="697" cy="315" r="24" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="697" y="321" fill="#3fb950" font-size="18" font-weight="700" text-anchor="middle">+</text>
  <text x="697" y="348" fill="#8b949e" font-size="10" text-anchor="middle">s45 [8:0]</text>

  <!-- Wiring from Registers to Level 1 Adders -->
  <!-- R0 -> Add 01 -->
  <path d="M 202 200 L 202 280 L 240 298" fill="none" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <!-- R1 -> Add 01 -->
  <path d="M 312 200 L 312 280 L 274 298" fill="none" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <!-- R2 -> Add 23 -->
  <path d="M 422 200 L 422 280 L 460 298" fill="none" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <!-- R3 -> Add 23 -->
  <path d="M 532 200 L 532 280 L 494 298" fill="none" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <!-- R4 -> Add 45 -->
  <path d="M 642 200 L 642 280 L 680 298" fill="none" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <!-- R5 -> Add 45 -->
  <path d="M 752 200 L 752 280 L 714 298" fill="none" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- Level 2 Adder (Sum 01 + 23) -->
  <circle cx="367" cy="405" r="26" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="367" y="412" fill="#3fb950" font-size="20" font-weight="700" text-anchor="middle">+</text>
  <text x="367" y="443" fill="#8b949e" font-size="10" text-anchor="middle">s0123 [9:0]</text>

  <!-- Wiring Level 1 to Level 2 -->
  <path d="M 257 339 L 257 375 L 345 398" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 477 339 L 477 375 L 389 398" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Level 3 Adder (Total Sum) -->
  <circle cx="560" cy="485" r="28" fill="#161b22" stroke="#3fb950" stroke-width="2.2"/>
  <text x="560" y="493" fill="#3fb950" font-size="22" font-weight="700" text-anchor="middle">+</text>
  <text x="560" y="525" fill="#f0f6fc" font-size="11" font-weight="700" text-anchor="middle">sum [11:0]</text>
  <text x="560" y="540" fill="#8b949e" font-size="9" text-anchor="middle">Max: 6 × 255 = 1530</text>

  <!-- Wiring to Level 3 -->
  <path d="M 393 405 L 536 470" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 697 339 L 697 455 L 585 478" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Probe: sum_dbg -->
  <path d="M 588 485 L 680 485" fill="none" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="4 2" marker-end="url(#arr)"/>
  <text x="690" y="489" fill="#8b949e" font-size="10">sum_dbg[11:0]</text>

  <!-- Section 3 Header: Scaler & Output -->
  <rect x="830" y="92" width="385" height="26" rx="5" fill="#9e6a03" fill-opacity="0.18" stroke="#d29922" stroke-width="1"/>
  <text x="1022" y="110" fill="#d29922" font-size="12" font-weight="700" text-anchor="middle">STAGE 3: NORMALIZATION &amp; REGISTER COMMIT</text>

  <!-- Scaler Block (>> 3) -->
  <rect x="860" y="450" width="115" height="70" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="917" y="480" fill="#d29922" font-size="13" font-weight="700" text-anchor="middle">Bit-Shift Scaler</text>
  <text x="917" y="498" fill="#f0f6fc" font-size="12" font-weight="700" text-anchor="middle">sum &gt;&gt; 3</text>
  <text x="917" y="513" fill="#8b949e" font-size="9" text-anchor="middle">(Divide by 8 ≈ 1/6)</text>

  <!-- Wire from Level 3 Adder to Scaler -->
  <line x1="588" y1="485" x2="860" y2="485" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arr-amber)"/>
  <text x="735" y="475" fill="#3fb950" font-size="10" font-weight="700">12-bit sum</text>

  <!-- Output Register -->
  <rect x="1040" y="450" width="100" height="70" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="1090" y="480" fill="#f0f6fc" font-size="13" font-weight="700" text-anchor="middle">Output Reg</text>
  <text x="1090" y="498" fill="#58a6ff" font-size="12" font-weight="700" text-anchor="middle">y_out[7:0]</text>
  <text x="1090" y="513" fill="#8b949e" font-size="9" text-anchor="middle">Registered 1-Cycle</text>

  <!-- Wire Scaler to Output Reg -->
  <line x1="975" y1="485" x2="1040" y2="485" stroke="#d29922" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1008" y="478" fill="#d29922" font-size="10">scaled[7:0]</text>

  <!-- Final Output Line -->
  <line x1="1140" y1="485" x2="1195" y2="485" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1195" y="475" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="end">y_out</text>

  <!-- Clock & Reset Distribution Line -->
  <rect x="40" y="575" width="1175" height="35" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <circle cx="65" cy="592" r="6" fill="#58a6ff"/>
  <text x="80" y="596" fill="#f0f6fc" font-size="11" font-weight="700">clk (100 MHz / 10 ns period)</text>
  <text x="290" y="596" fill="#8b949e" font-size="11">• Synchronously clocks Delay Line (R0–R5) &amp; Output Register (y_out)</text>

  <circle cx="850" cy="592" r="6" fill="#f85149"/>
  <text x="865" y="596" fill="#f85149" font-size="11" font-weight="700">rst (Active-High Sync Reset)</text>
  <text x="1055" y="596" fill="#8b949e" font-size="11">• Clears all registers to 0</text>
</svg>
